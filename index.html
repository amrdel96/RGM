<!doctype html>
<html lang="en" dir="ltr">
<head>

  <title>Roza Graphic Machinery | RGM</title>
  <style>
    :root{--navy:#182765;--blue:#004f9e;--ink:#172033;--muted:#657087;--line:#dce2eb;--bg:#f4f6f9}*{box-sizing:border-box}body{margin:0;font:16px/1.65 Arial,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.top{background:var(--navy);color:#fff;padding:8px max(20px,calc((100vw - 1150px)/2));font-size:12px}.header{max-width:1220px;margin:auto;min-height:104px;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:25px;border-bottom:1px solid var(--line)}.logo{width:115px;height:74px;object-fit:contain}.nav{display:flex;gap:22px;align-items:center;font-size:13px;font-weight:bold}.nav a:hover,.nav a.active{color:var(--blue)}.lang{border:1px solid var(--line);background:#fff;padding:9px 13px;color:var(--navy)}main{min-height:calc(100vh - 220px)}.notice{background:#eef3f8;color:#273e71;text-align:center;padding:9px;font-size:12px}.hero,.section,.page{max-width:1220px;margin:auto;padding:60px 24px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:center}.eyebrow{color:var(--blue);font-size:12px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase}.hero h1,.page h1{font-size:clamp(38px,5vw,62px);line-height:1.08;margin:15px 0 18px;color:var(--navy)}.lead{color:var(--muted);font-size:18px;max-width:660px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:27px}.btn{display:inline-block;background:var(--blue);color:#fff;border:1px solid var(--blue);padding:12px 19px;font-weight:bold}.btn.alt{background:#fff;color:var(--navy);border-color:var(--line)}.hero-card{min-height:330px;background:var(--navy);color:#fff;padding:31px;display:flex;flex-direction:column;justify-content:space-between}.hero-card strong{font-size:72px;line-height:.9}.hero-card small{color:#b9c8ed}.band{background:var(--bg)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid var(--line);padding:24px;background:#fff}.card h3{margin-top:0;color:var(--navy)}.tag{font-size:11px;color:#276748;background:#edf7f1;padding:4px 8px;display:inline-block}.machine{padding:0;overflow:hidden}.machine .image{height:168px;background:linear-gradient(135deg,#e6ebf4,#fafbfd);display:grid;place-items:center;color:#62708c;font-weight:bold}.machine .body{padding:20px}.specs{display:flex;gap:18px;color:var(--muted);font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:35px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:12px;background:#fff;border:1px solid var(--line);padding:13px}.filters input,.filters select,input,textarea{width:100%;border:1px solid var(--line);padding:11px;background:#fff;font:inherit}.filters button{border:0;background:var(--blue);color:#fff;padding:10px 18px}.form{max-width:760px;margin:0 auto;border:1px solid var(--line);padding:28px;background:#fff}.form label{display:block;font-weight:bold;margin:14px 0 6px}.form textarea{min-height:120px}.form button{border:0;background:var(--blue);color:#fff;padding:12px 20px;margin-top:18px}.article{max-width:800px}.article p{color:#4b5669}.footer{background:var(--navy);color:#fff;padding:36px max(24px,calc((100vw - 1172px)/2));display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footer small{color:#b9c8ed}.admin{background:var(--bg);min-height:100vh;padding:36px}.admin-box{max-width:440px;margin:70px auto;padding:32px;background:#fff;border:1px solid var(--line)}.empty{padding:35px;text-align:center;border:1px dashed var(--line);color:var(--muted)}[dir=rtl]{font-family:Tahoma,Arial,sans-serif;text-align:right}[dir=rtl] .eyebrow{letter-spacing:0}@media(max-width:760px){.header{min-height:auto;flex-wrap:wrap}.nav{order:3;width:100%;overflow:auto;gap:16px}.hero,.split{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.hero-card{min-height:230px}.section,.page,.hero{padding:38px 20px}.top{padding-inline:20px}}
  </style>
</head>
<body><div id="app"></div><script>
const base=location.pathname.startsWith('/RGM')?'/RGM':'';
const query=new URLSearchParams(location.search);let route=query.get('route')||location.pathname.slice(base.length)||'/';route=route.replace(/\/$/,'')||'/';
const ar=route==='/ar'||route.startsWith('/ar/');const clean=ar?(route.slice(3)||'/'):route;document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';
const T=ar?{home:'الرئيسية',machines:'الماكينات',services:'الخدمات',about:'عن RGM',blog:'المقالات',contact:'تواصل معنا',find:'ابحث عن ماكينة',sell:'بيع ماكينة',hero:'ماكينات طباعة مستعملة. موردون حول العالم.',intro:'نساعدك في شراء وبيع وتوريد ماكينات الطباعة والتغليف والتجهيز النهائي المستعملة.',browse:'تصفح الماكينات',request:'اطلب ماكينة',ready:'واجهة عرض على GitHub Pages — الربط التشغيلي يحتاج Vercel وSupabase.',inventory:'استكشف الماكينات المتاحة',noMachines:'لا توجد ماكينات منشورة حالياً',serviceTitle:'خدمات فنية ولوجستية للماكينات',contactTitle:'أرسل استفسارك',submit:'إرسال الاستفسار',admin:'تسجيل دخول الموظفين',demo:'هذه واجهة تجريبية. تشغيل الدخول وحفظ البيانات يحتاج Vercel وSupabase.'}:{home:'Home',machines:'Machinery',services:'Services',about:'About RGM',blog:'Articles',contact:'Contact',find:'Find a machine',sell:'Sell your machine',hero:'Used printing machinery. Sourced globally.',intro:'We support buying, selling and sourcing used printing, packaging and finishing machinery.',browse:'Browse machinery',request:'Request a machine',ready:'GitHub Pages UI preview — operational services require Vercel and Supabase.',inventory:'Explore available machinery',noMachines:'No machines are published yet',serviceTitle:'Technical and logistics support for machinery',contactTitle:'Send your inquiry',submit:'Send inquiry',admin:'Staff sign in',demo:'This is a UI preview. Authentication and data storage require Vercel and Supabase.'};
function path(p){return base+(ar?'/ar':'')+p}function link(p,label){return '<a href="'+path(p)+'" class="'+(clean===p?'active':'')+'">'+label+'</a>'}function layout(content){return '<div class="top">ROZA GRAPHIC MACHINERY · USED PRINTING MACHINERY</div><header class="header"><a href="'+path('/')+'"><img class="logo" src="'+base+'/public/rgm-logo.png" alt="RGM"></a><nav class="nav">'+link('/',T.home)+link('/machines',T.machines)+link('/services',T.services)+link('/about',T.about)+link('/blog',T.blog)+link('/contact',T.contact)+'</nav><a class="lang" href="'+(ar?base+(clean==='/'?'':clean):base+'/ar'+(clean==='/'?'':clean))+'">'+(ar?'English':'العربية')+'</a></header><div class="notice">'+T.ready+'</div><main>'+content+'</main><footer class="footer"><div><strong>Roza Graphic Machinery</strong><br><small>'+T.intro+'</small></div><div><small>© RGM · UI preview</small></div></footer>'}
const form='<form class="form" onsubmit="event.preventDefault();alert(\''+(ar?'تم استلام طلبك في وضع العرض.':'Your demo inquiry was received.')+'\')"><label>'+ (ar?'الاسم':'Full name')+'</label><input required><label>'+ (ar?'البريد الإلكتروني':'Email')+'</label><input type="email" required><label>'+ (ar?'الهاتف / واتساب':'Phone / WhatsApp')+'</label><input><label>'+ (ar?'الرسالة':'Message')+'</label><textarea></textarea><button>'+T.submit+'</button></form>';
let content='';
if(clean==='/')content='<section class="hero"><div><div class="eyebrow">RGM · PRINTING MACHINERY</div><h1>'+T.hero+'</h1><p class="lead">'+T.intro+'</p><div class="actions"><a class="btn" href="'+path('/machines')+'">'+T.browse+'</a><a class="btn alt" href="'+path('/find-a-machine')+'">'+T.request+'</a></div></div><div class="hero-card"><small>RGM</small><strong>ROZA</strong><small>Printing · Packaging · Finishing<br>Technical & commercial support</small></div></section><section class="band"><div class="section"><h2>'+T.serviceTitle+'</h2><div class="grid"><div class="card"><h3>'+ (ar?'التركيب والصيانة':'Installation & maintenance')+'</h3><p>'+T.intro+'</p></div><div class="card"><h3>'+ (ar?'التعبئة والشحن':'Packing & shipping')+'</h3><p>'+T.intro+'</p></div><div class="card"><h3>'+ (ar?'الفك والنقل':'Dismantling & relocation')+'</h3><p>'+T.intro+'</p></div></div></div></section>';
else if(clean==='/machines')content='<section class="page"><div class="eyebrow">INVENTORY</div><h1>'+T.inventory+'</h1><div class="filters"><input placeholder="'+(ar?'ابحث بالماركة أو الطراز':'Search by manufacturer or model')+'"><select><option>'+ (ar?'كل الفئات':'All categories')+'</option></select><select><option>'+ (ar?'كل الماركات':'All manufacturers')+'</option></select><select><option>'+ (ar?'كل الحالات':'All statuses')+'</option></select><button>'+ (ar?'بحث':'Search')+'</button></div><div class="empty" style="margin-top:25px"><h3>'+T.noMachines+'</h3><p>'+T.intro+'</p><a class="btn" href="'+path('/find-a-machine')+'">'+T.request+'</a></div></section>';
else if(clean==='/services')content='<section class="page"><div class="eyebrow">SERVICES</div><h1>'+T.serviceTitle+'</h1><div class="grid">'+['Cylinder repair','Installation & maintenance','Packing & shipping','Dismantling & relocation','After-sales support'].map((x,i)=>'<div class="card"><h3>'+ (ar?['إصلاح السلندرات','التركيب والصيانة','التعبئة والشحن','الفك والنقل','خدمات ما بعد البيع'][i]:x)+'</h3><p>'+T.intro+'</p><a href="'+path('/contact')+'" class="btn alt">'+T.contact+'</a></div>').join('')+'</div></section>';
else if(clean==='/about')content='<section class="page article"><div class="eyebrow">ABOUT RGM</div><h1>'+T.about+'</h1><p>'+T.intro+'</p><p>'+ (ar?'تعمل RGM في تجارة الماكينات المستعملة ودعم أعمال التركيب والصيانة والفك والنقل والتعبئة والشحن.':'RGM trades used machinery and supports installation, maintenance, dismantling, relocation, packing and shipment.')+'</p><a class="btn" href="'+path('/contact')+'">'+T.contact+'</a></section>';
else if(clean==='/blog')content='<section class="page"><div class="eyebrow">INSIGHTS</div><h1>'+T.blog+'</h1><div class="grid">'+['History of Offset Printing','Types of Offset Printing','Different Types of Printing Machines'].map(x=>'<article class="card"><span class="tag">ARTICLE</span><h3>'+x+'</h3><p>'+T.intro+'</p></article>').join('')+'</div></section>';
else if(clean==='/contact'||clean==='/find-a-machine'||clean==='/sell-your-machine'){let title=clean==='/find-a-machine'?T.find:clean==='/sell-your-machine'?T.sell:T.contactTitle;content='<section class="page"><div class="eyebrow">RGM</div><h1>'+title+'</h1><p class="lead">'+T.intro+'</p>'+form+'</section>'}
else if(clean==='/admin')content='<section class="admin"><div class="admin-box"><img class="logo" src="'+base+'/public/rgm-logo.png" alt="RGM"><h1>'+T.admin+'</h1><p>'+T.demo+'</p><label>Email</label><input type="email"><label>Password</label><input type="password"><button onclick="alert(\''+(ar?'يرجى نشر النسخة على Vercel أولاً.':'Deploy to Vercel first.')+'\')">'+T.admin+'</button></div></section>';
else content='<section class="page"><h1>404</h1><p>Page not found.</p><a class="btn" href="'+path('/')+'">'+T.home+'</a></section>';
document.getElementById('app').innerHTML=layout(content);
</script></body></html>
